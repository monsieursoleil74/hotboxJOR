name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # le dépôt EST le paquet Python : on le clone dans un dossier
      # nommé hotboxLibrary, comme au studio (posé tel quel sur R:\)
      - uses: actions/checkout@v4
        with:
          path: hotboxLibrary

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances (PySide6 + libs Qt offscreen)
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyflakes
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0

      - name: Lint (pyflakes, vendor exclu)
        run: |
          cd hotboxLibrary
          python -m pyflakes $(git ls-files '*.py' | grep -Ev '(^|/)vendor/')

      - name: Suite de tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python hotboxLibrary/tests/test_editor.py
