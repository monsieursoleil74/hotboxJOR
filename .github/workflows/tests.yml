name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances (PySide6 + libs Qt offscreen)
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyflakes
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0

      - name: Lint (pyflakes, vendor exclu)
        run: |
          python -m pyflakes $(git ls-files 'hotbox_designer/**/*.py' 'hotbox_designer/*.py' 'tests/*.py' | grep -v '/vendor/')

      - name: Suite de tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_editor.py
